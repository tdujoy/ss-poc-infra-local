services:

  postgres:
    image: postgres:16
    container_name: ss-tms-db-postgres
    restart: unless-stopped
    profiles: ["core"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ss_tms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    container_name: ss-tms-db-mongo
    restart: unless-stopped
    profiles: ["core"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - ss_tms_mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: ss-tms-os-minio
    restart: unless-stopped
    profiles: ["core"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - ss_tms_minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: ss-tms-os-minio-init
    profiles: ["core"]
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb -p local/$$MINIO_DEFAULT_BUCKET || true;
      mc anonymous set none local/$$MINIO_DEFAULT_BUCKET || true;
      "

  redis:
    image: redis:7-alpine
    container_name: ss-tms-cache-redis
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ss_tms_redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ss-tms-mb-rabbitmq
    restart: unless-stopped
    profiles: ["broker"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"
    volumes:
      - ss_tms_rabbitmq_data:/var/lib/rabbitmq

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: ss-tms-trace-jaeger
    restart: unless-stopped
    profiles: ["obs"]
    ports:
      - "${JAEGER_PORT}:16686"
      - "14250:14250"

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: ss-tms-mon-prometheus
    restart: unless-stopped
    profiles: ["obs"]
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ss_tms_prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.4.2
    container_name: ss-tms-mon-grafana
    restart: unless-stopped
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ss_tms_grafana_data:/var/lib/grafana

  traefik:
    image: traefik:v3.0
    container_name: ss-tms-proxy-traefik
    restart: unless-stopped
    profiles: ["gateway"]
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --entrypoints.web.address=:80
    ports:
      - "${TRAEFIK_HTTP_PORT}:80"
      - "${TRAEFIK_DASHBOARD_PORT}:8080"

  mailpit:
    image: axllent/mailpit:latest
    container_name: ss-tms-mail-mailpit
    restart: unless-stopped
    profiles: ["mail"]
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"

  vault:
    image: hashicorp/vault:1.16
    container_name: ss-tms-sec-vault
    restart: unless-stopped
    profiles: ["secrets"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${VAULT_PORT}:8200"
    command: vault server -dev

volumes:
  ss_tms_pg_data:
  ss_tms_mongo_data:
  ss_tms_minio_data:
  ss_tms_redis_data:
  ss_tms_rabbitmq_data:
  ss_tms_prometheus_data:
  ss_tms_grafana_data:
