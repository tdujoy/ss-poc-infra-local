name: st-poc-local-infra

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - st_poc_shared

x-resources:
  tiny: &resources-tiny
    cpus: "0.25"
    mem_limit: 128m
    mem_reservation: 64m
  small: &resources-small
    cpus: "0.50"
    mem_limit: 512m
    mem_reservation: 128m
  medium: &resources-medium
    cpus: "0.75"
    mem_limit: 768m
    mem_reservation: 256m
  large: &resources-large
    cpus: "1.00"
    mem_limit: 1g
    mem_reservation: 384m

services:
  postgres:
    <<: [*service-defaults, *resources-medium]
    image: postgres:16.4
    container_name: st-local-db-postgres
    profiles: ["core"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - st_poc_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    <<: [*service-defaults, *resources-large]
    image: mongo:7.0.14
    container_name: st-local-db-mongo
    profiles: ["core"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - st_poc_mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: [*service-defaults, *resources-tiny]
    image: redis:7.4.2-alpine
    container_name: st-local-cache-redis
    profiles: ["core"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - st_poc_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  garage:
    <<: [*service-defaults, *resources-small]
    image: dxflrs/garage:v1.0.1
    container_name: st-local-os-garage
    profiles: ["core"]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
    command: ["/garage", "server"]
    ports:
      - "${GARAGE_S3_PORT}:3900"
      - "${GARAGE_ADMIN_PORT}:3903"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - st_poc_garage_meta:/var/lib/garage/meta
      - st_poc_garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    <<: [*service-defaults, *resources-medium]
    image: rabbitmq:3.13.7-management
    container_name: st-local-mb-rabbitmq
    profiles: ["broker"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"
    volumes:
      - st_poc_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  mailpit:
    <<: [*service-defaults, *resources-tiny]
    image: axllent/mailpit:v1.21.8
    container_name: st-local-mail-mailpit
    profiles: ["mail"]
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  seq:
    <<: [*service-defaults, *resources-medium]
    image: datalust/seq:2024.3
    container_name: st-local-log-seq
    profiles: ["obs"]
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "${SEQ_PORT}:80"
      - "${SEQ_INGEST_PORT}:5341"
    volumes:
      - st_poc_seq_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/80 && printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q \"200 OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  jaeger:
    <<: [*service-defaults, *resources-small]
    image: jaegertracing/all-in-one:1.57
    container_name: st-local-trace-jaeger
    profiles: ["obs"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT}:16686"
      - "${JAEGER_OTLP_GRPC_PORT}:4317"
      - "${JAEGER_OTLP_HTTP_PORT}:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:14269/ | grep -q 'Server available'"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    <<: [*service-defaults, *resources-small]
    image: prom/prometheus:v2.51.2
    container_name: st-local-mon-prometheus
    profiles: ["obs"]
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - st_poc_prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    <<: [*service-defaults, *resources-small]
    image: grafana/grafana:10.4.2
    container_name: st-local-mon-grafana
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - st_poc_grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Persistent local Vault using file storage. This keeps secrets across restarts,
  # but it is still a single-node local POC setup, not production HA Vault.
  vault:
    <<: [*service-defaults, *resources-small]
    image: hashicorp/vault:1.16
    container_name: st-local-sec-vault
    profiles: ["secrets"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
    command: vault server -config=/vault/config/vault.hcl
    ports:
      - "${VAULT_PORT}:8200"
    volumes:
      - ./vault/config/vault.hcl:/vault/config/vault.hcl:ro
      - st_poc_vault_data:/vault/file
      - st_poc_vault_logs:/vault/logs
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  portainer:
    <<: [*service-defaults, *resources-small]
    image: portainer/portainer-ce:2.20.3
    container_name: st-local-tools-portainer
    profiles: ["tools"]
    ports:
      - "${PORTAINER_PORT}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - st_poc_portainer_data:/data
    healthcheck:
      test: ["CMD", "/portainer", "--version"]
      interval: 30s
      timeout: 5s
      retries: 5

  garage-webui:
    <<: [*service-defaults, *resources-small]
    image: khairul169/garage-webui@sha256:17c793551873155065bf9a022dabcde874de808a1f26e648d4b82e168806439c
    container_name: st-local-tools-garage-webui
    profiles: ["core"]
    environment:
      CONFIG_PATH: /etc/garage.toml
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      API_BASE_URL: http://garage:3903
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: garage
    ports:
      - "${GARAGE_WEBUI_PORT}:3909"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
    depends_on:
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:3909"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Example for future app services:
  # some-api:
  #   image: your-api-image
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy

volumes:
  st_poc_pg_data:
  st_poc_mongo_data:
  st_poc_redis_data:
  st_poc_garage_meta:
  st_poc_garage_data:
  st_poc_rabbitmq_data:
  st_poc_seq_data:
  st_poc_prometheus_data:
  st_poc_grafana_data:
  st_poc_vault_data:
  st_poc_vault_logs:
  st_poc_portainer_data:

networks:
  st_poc_shared:
    name: st_poc_shared
    driver: bridge
